name: Build Markdown to PDF and Upload to Drive

on:
  push:
    branches:
      - main
    paths:
      - "docs/**.md"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Setup Pandoc
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1

      # 3. Instala dependências LaTeX
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra

      # 4. Cria pasta de saída
      - name: Create PDF output directory
        run: mkdir -p pdfs

      # 5. Converte Markdown para PDF
      - name: Convert Markdown files to PDF
        run: |
          find docs -type f -name "*.md" | while read -r file; do
            output_file="pdfs/${file#docs/}"
            output_file="${output_file%.md}.pdf"
            mkdir -p "$(dirname "$output_file")"
            echo "Convertendo '$file' para '$output_file'..."
            pandoc "$file" -o "$output_file" --pdf-engine=xelatex \
              -V fontsize=11pt \
              -V mainfont="DejaVu Sans" \
              -V geometry:"left=2cm,right=2cm,top=2.5cm,bottom=2.5cm" \
              -V linestretch=1.2
          done

      # 6. (Opcional) Upload do artefato para o GitHub
      - name: Upload PDF artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-gerados
          path: pdfs/

      # 7. (NOVO) DEBUG: Verifica o conteúdo real dos secrets
      - name: Debug Secrets Content
        run: |
          echo "--- Verificando GDRIVE_CREDENTIALS ---"
          echo "Primeiros 20 caracteres:"
          echo "${{ secrets.GDRIVE_CREDENTIALS }}" | cut -c1-20
          echo "--- Verificando RCLONE_CONF ---"
          echo "Primeiros 20 caracteres:"
          echo "${{ secrets.RCLONE_CONF }}" | cut -c1-20
          echo "--- Fim do Debug ---"

      # 8. (MELHORADO) Upload para o Google Drive com rclone
      - name: Upload PDFs to Google Drive using rclone
        run: |
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          # Usando printf para mais segurança ao escrever os arquivos
          printf "%s" "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          printf "%s" "${{ secrets.GDRIVE_CREDENTIALS }}" > /tmp/gdrive_credentials.json
          rclone copy ./pdfs/ "gdrive:${{ secrets.GDRIVE_FOLDER_ID }}" --progress
