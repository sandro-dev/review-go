name: Build Markdown to PDF

# Gatilhos: roda quando houver um push para a branch 'main'
on:
  push:
    branches:
      - main
    paths:
      - "docs/**.md" # Só roda se arquivos .md na pasta docs forem alterados
  workflow_dispatch: # Permite rodar manualmente pela interface do GitHub

jobs:
  convert-markdown:
    runs-on: ubuntu-latest
    steps:
      # 1. Pega o código do seu repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Instala o Pandoc e dependências LaTeX
      - name: Set up Pandoc
        uses: pandoc/actions/setup-pandoc@v1
        with:
          # A versão pode ser ajustada conforme necessário
          version: "latest"

      # 3. Cria o diretório para os PDFs
      - name: Create PDF output directory
        run: mkdir -p pdfs

      # 4. Converte os arquivos Markdown para PDF
      - name: Convert Markdown files to PDF
        run: |
          for file in docs/*.md; do
            pandoc "$file" \
              -o "pdfs/$(basename "${file%.md}").pdf" \
              --pdf-engine=xelatex \
              -V mainfont="DejaVu Sans" # Fonte que suporta muitos caracteres
          done

      # 5. Disponibiliza os PDFs gerados como um "artefato" do workflow
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-gerados
          path: pdfs/
