name: Build Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - "docs/**.md"
  workflow_dispatch:

jobs:
  convert-markdown:
    runs-on: ubuntu-latest
    steps:
      # 1. Pega o código do seu repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Instala a última versão do Pandoc
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1

      # 3. (NOVO) Instala as dependências do LaTeX
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-fonts-recommended texlive-latex-extra

      # 4. Cria o diretório raiz para os PDFs
      - name: Create PDF output directory
        run: mkdir -p pdfs

      # 5. Converte os arquivos Markdown para PDF
      - name: Convert Markdown files to PDF
        run: |
          find docs -type f -name "*.md" | while read -r file; do
            output_file="pdfs/${file#docs/}"
            output_file="${output_file%.md}.pdf"
            mkdir -p "$(dirname "$output_file")"

            echo "Convertendo '$file' para '$output_file'..."
            
            pandoc "$file" \
              -o "$output_file" \
              --pdf-engine=xelatex \
              -V mainfont="DejaVu Sans"
          done

      # 6. Disponibiliza os PDFs gerados como um "artefato"
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-gerados
          path: pdfs/
