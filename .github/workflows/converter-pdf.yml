name: Build Markdown to PDF and Upload to Drive

on:
  push:
    branches:
      - main
    paths:
      - "docs/**.md"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. Pega o código do seu repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Instala a última versão do Pandoc
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1

      # 3. Instala as dependências do LaTeX
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra

      # 4. Cria o diretório raiz para os PDFs
      - name: Create PDF output directory
        run: mkdir -p pdfs

      # 5. Converte os arquivos Markdown para PDF
      - name: Convert Markdown files to PDF
        run: |
          find docs -type f -name "*.md" | while read -r file; do
            output_file="pdfs/${file#docs/}"
            output_file="${output_file%.md}.pdf"
            mkdir -p "$(dirname "$output_file")"
            echo "Convertendo '$file' para '$output_file'..."
            pandoc "$file" -o "$output_file" --pdf-engine=xelatex \
              -V fontsize=11pt \
              -V mainfont="DejaVu Sans" \
              -V geometry:"left=2cm,right=2cm,top=2.5cm,bottom=2.5cm" \
              -V linestretch=1.2
          done

      # 6. (Opcional) Disponibiliza os PDFs como artefato no GitHub
      - name: Upload PDF artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-gerados
          path: pdfs/

      # 7. (CORRIGIDO) Faz o upload de cada PDF para o Google Drive
      - name: Upload PDFs to Google Drive
        uses: adityak74/google-drive-upload@v1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          source: ./pdfs/
          recursive: true
