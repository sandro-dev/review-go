name: Build Markdown to PDF and Upload to Drive

on:
  push:
    branches:
      - main
    paths:
      - "docs/**.md"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # Passos 1 a 6 permanecem os mesmos...
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra
      - name: Create PDF output directory
        run: mkdir -p pdfs
      - name: Convert Markdown files to PDF
        run: |
          find docs -type f -name "*.md" | while read -r file; do
            output_file="pdfs/${file#docs/}"
            output_file="${output_file%.md}.pdf"
            mkdir -p "$(dirname "$output_file")"
            echo "Convertendo '$file' para '$output_file'..."
            pandoc "$file" -o "$output_file" --pdf-engine=xelatex \
              -V fontsize=11pt \
              -V mainfont="DejaVu Sans" \
              -V geometry:"left=2cm,right=2cm,top=2.5cm,bottom=2.5cm" \
              -V linestretch=1.2
          done
      - name: Upload PDF artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-gerados
          path: pdfs/

      # 7. (FINAL E CORRIGIDO) Upload com Base64 e novo nome de remote
      - name: Upload PDFs to Google Drive using rclone
        run: |
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone

          # MUDANÇA 1: Decodifica o secret RCLONE_CONF para criar o arquivo de configuração
          echo "${{ secrets.RCLONE_CONF }}" | base64 --decode > ~/.config/rclone/rclone.conf

          # MUDANÇA 2: Usa o novo nome de remote "googledrive" no comando
          rclone copy ./pdfs/ "googledrive:${{ secrets.GDRIVE_FOLDER_ID }}" --progress
