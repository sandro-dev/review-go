name: Build Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - "docs/**.md"
  workflow_dispatch:

jobs:
  convert-markdown:
    runs-on: ubuntu-latest
    steps:
      # 1. Pega o código do seu repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Instala a ÚLTIMA versão do Pandoc e dependências LaTeX
      - name: Set up Pandoc
        # CORREÇÃO: Removido o 'with:' para que a action use o comportamento padrão (instalar a versão mais recente)
        uses: pandoc/actions/setup@v1

      # 3. Cria o diretório para os PDFs
      - name: Create PDF output directory
        run: mkdir -p pdfs

      # 4. Converte os arquivos Markdown para PDF
      - name: Convert Markdown files to PDF
        run: |
          for file in docs/*.md; do
            pandoc "$file" \
              -o "pdfs/$(basename "${file%.md}").pdf" \
              --pdf-engine=xelatex \
              -V mainfont="DejaVu Sans"
          done

      # 5. Disponibiliza os PDFs gerados como um "artefato" do workflow
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-gerados
          path: pdfs/
